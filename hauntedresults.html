<!DOCTYPE html>
<!-- Haunted House results. The run travels inside the link (#r=…), packed by the game;
     nothing is stored or sent anywhere. Copyright (c) 2026 m1keLima. All rights reserved. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="darkreader-lock">
<title>Haunted House Results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b2a86'/%3E%3Cellipse cx='32' cy='38' rx='20' ry='15' fill='%23ff8a1f'/%3E%3Cpath d='M30 14h4v10h-4z' fill='%234fbf7a'/%3E%3C/svg%3E">
<style>
:root{--bg:#05040a;--card:#140e1d;--ink:#f0e6d6;--dim:#a597b5;--line:#2e2140;--pumpkin:#ff8a1f;--gold:#ffcf5c;--good:#4fbf7a;--bad:#ff6b5c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 600px at 50% -10%,#1c1028,#0d0a14 50%,#05040a);background-color:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;min-height:100vh}
main{max-width:820px;margin:0 auto;padding:22px 16px 48px}
h1{margin:0;font-size:clamp(30px,7vw,46px);text-align:center;background:linear-gradient(180deg,#ffd469,#ff8a1f 50%,#8c1d06);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--dim);margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.score{display:flex;align-items:baseline;justify-content:center;gap:10px}
.score b{font-size:64px;color:var(--gold)} .score span{color:var(--dim)}
.rank{text-align:center;font-size:24px;font-weight:800;color:var(--pumpkin)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.fact{background:#0d0915;border-radius:12px;padding:10px;text-align:center} .fact i{display:block;font-style:normal;color:var(--dim);font-size:13px} .fact b{font-size:20px}
h2{font-size:20px;margin:0 0 10px}
.topic{margin:14px 0 6px;font-weight:800;color:var(--gold)}
.m{border-top:1px solid var(--line);padding:8px 0}
.m .q{color:var(--ink);margin:2px 0} .x{color:var(--bad)} .a{color:var(--good)} .gold{color:var(--gold)} .m small{color:var(--dim)}
.none{text-align:center;color:var(--good);font-size:20px}
.err{text-align:center;color:var(--dim)}
a{color:var(--pumpkin)}
</style></head><body><main>
<h1>Haunted House</h1><div class="sub" id="sub">results</div>
<div id="out"></div>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function unb64(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function unpack(code){
  const kind=code[0], u=unb64(code.slice(1));
  if(kind==="j") return JSON.parse(new TextDecoder().decode(u));
  const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  return JSON.parse(txt);
}
const tryWord=n=>n<=1?"first try":n===2?"second try":`try ${n}`;
(async()=>{
  const m=location.hash.match(/r=([A-Za-z0-9_-]+)/);
  if(!m){ $("#out").innerHTML=`<div class="card err">This page shows a run's results when opened from the link the game sends.</div>`; return; }
  let R; try{ R=await unpack(m[1]); }catch(e){ $("#out").innerHTML=`<div class="card err">This link is incomplete or damaged — ask for it to be sent again.</div>`; return; }
  const when=new Date(R.d).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  /* v1 links (v37) carried only the mistakes; v2 (v38) carries every attempt */
  const ex = R.v>=2 ? R.ex : R.m.map(m=>[m[5]||"room",m[0],m[1],m[2],m[3],0,m[4],null]);
  /* one item per exercise: consecutive attempts at the same question */
  const items=[]; ex.forEach(e=>{ const last=items[items.length-1];
    if(last && last.k===e[0] && last.q===e[2] && !last.ok) last.tries.push(e); else items.push({k:e[0],t:e[1],q:e[2],a:e[4],tries:[e],get ok(){ return this.tries.some(x=>x[5]); }}); });
  const firstOk=items.filter(it=>it.tries[0][5]).length, laterOk=items.filter(it=>!it.tries[0][5]&&it.ok).length, never=items.filter(it=>!it.ok).length;
  document.title=`${R.n||"Haunted House"} — ${R.done===false?"session":R.s+" sweets"}`;
  $("#sub").textContent=`${R.n?R.n+" · ":""}${R.g} · ${R.w} · ${when}`;
  const wrongBy={}; items.filter(it=>!it.tries[0][5]).forEach(it=>wrongBy[it.t]=(wrongBy[it.t]||0)+1);
  const practise=Object.entries(wrongBy).sort((a,b)=>b[1]-a[1]);
  const mark=it=> it.tries[0][5]?`<span class="a">✓ first try</span>`: it.ok?`<span class="gold">✓ on try ${it.tries.findIndex(x=>x[5])+1}</span>`:`<span class="x">${R.v>=2?"✗ not this time":"✗ answered wrong"}</span>`;
  const secs=it=>{ const t=it.tries.map(x=>x[7]).filter(x=>x!=null), n=t.reduce((a,b)=>a+b,0); return n?` · ${n} s`:""; };
  $("#out").innerHTML=`${R.v>=2&&R.done===false?"":`<div class="card">
      <div class="score"><b>${R.s}</b><span>sweets</span></div><div class="rank">${esc(R.r)}</div>
      <div class="facts"><div class="fact"><i>Result</i><b>${R.won?"🌕 got out":"🎃 caught"}</b></div>
        <div class="fact"><i>Rooms</i><b>${R.rm} / 10</b></div><div class="fact"><i>Time</i><b>${esc(R.t)}</b></div>
        <div class="fact"><i>Grade</i><b>${esc(R.g)}</b></div></div></div>`}
    ${R.v>=2?`<div class="card"><div class="facts" style="margin-top:0">
        <div class="fact"><i>Exercises</i><b>${items.length}</b></div><div class="fact"><i>Right first time</i><b class="a">${firstOk}</b></div>
        <div class="fact"><i>Right on a later try</i><b class="gold">${laterOk}</b></div><div class="fact"><i>Not got</i><b class="x">${never}</b></div></div>
      ${practise.length?`<p style="margin:14px 0 0"><b>To practise:</b> ${practise.map(([t,n])=>esc(t)+(n>1?` (${n})`:"")).join(", ")}</p>`:`<p class="none" style="margin:14px 0 0">Everything right first time!</p>`}</div>`:""}
    <div class="card"><h2>${R.v>=2?"📝 Every exercise, in order":"📒 To practise"}</h2>
      ${items.length?items.map((it,i)=>`<div class="m"><small>${i+1}. ${esc(it.k)} · ${esc(it.t)}${secs(it)}</small>
          <div class="q">${esc(it.q)}</div><div>${mark(it)} · right answer <span class="a">${esc(it.a)}</span>${it.tries.filter(x=>!x[5]).length?` · <span class="x">answered ${it.tries.filter(x=>!x[5]).map(x=>esc(x[3])).join(", then ")}</span>`:""}</div></div>`).join("")
        :`<div class="none">No exercises in this session.</div>`}
      <p style="margin:16px 0 0;font-size:15px;color:var(--dim)">Practise the ideas behind these in <a href="hauntedpractice.html">Haunted Practice</a>.</p></div>`;
})();
</script></body></html>
